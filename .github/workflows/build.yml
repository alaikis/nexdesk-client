name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libjpeg-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
        continue-on-error: true
      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../nex-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-linux-x64
          path: build/nex-linux-x64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
        continue-on-error: true
      - name: Package
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../../nex-ios.zip Payload
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-ios
          path: build/nex-ios.zip

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
        continue-on-error: true
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../nex-macos.zip *.app
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-macos
          path: build/nex-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
        continue-on-error: true
        env:
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      - name: Package
        shell: bash
        run: |
          cd build/windows/x64/Release
          7z a ../../../nex-windows.zip .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-windows
          path: build/nex-windows.zip

  release:
    name: Create Release
    needs: [build-linux, build-android, build-ios, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: nex-*
      - name: List downloaded files
        run: |
          echo "=== Downloaded files ==="
          find release-assets/ -type f 2>/dev/null | while read f; do
            echo "  $f ($(stat -c%s "$f") bytes)"
          done
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release (ignore error if exists)
          gh release create "${{ github.ref_name }}" \
            --title "NEX ${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            --prerelease 2>/dev/null || true
          
          # Upload all files
          echo "=== Uploading files ==="
          for f in release-assets/*; do
            if [ -f "$f" ]; then
              echo "Uploading $(basename $f)..."
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            fi
          done
          
          # Show final assets
          echo "=== Final Release Assets ==="
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' 2>/dev/null || echo "Could not view release"