name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libjpeg-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release 2>&1 | tee build.log
        continue-on-error: true
      - run: cat build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build-log
          path: build.log

  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release 2>&1 | tee build.log
        continue-on-error: true
      - run: cat build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log
          path: build.log

  build-ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign 2>&1 | tee build.log
        continue-on-error: true
      - run: cat build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: build.log

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release 2>&1 | tee build.log
        continue-on-error: true
      - run: cat build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-log
          path: build.log

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release 2>&1 | tee build.log
        continue-on-error: true
      - run: cat build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-log
          path: build.log
