name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libjpeg-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
        continue-on-error: true
      - name: Package and Upload
        run: |
          if [ -d build/linux/x64/release/bundle ]; then
            cd build/linux/x64/release/bundle
            tar -czf ../../../nex-linux-x64.tar.gz .
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nex-linux-x64
          path: build/nex-linux-x64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nex-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
        continue-on-error: true
      - name: Package and Upload
        run: |
          if [ -d build/ios/iphoneos/Runner.app ]; then
            mkdir -p build/ios/ipa/Payload
            cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r ../../nex-ios.zip Payload
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nex-ios
          path: build/nex-ios.zip

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
        continue-on-error: true
      - name: Package and Upload
        run: |
          if ls build/macos/Build/Products/Release/*.app 1>/dev/null 2>&1; then
            cd build/macos/Build/Products/Release
            zip -r ../../../nex-macos.zip *.app
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nex-macos
          path: build/nex-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
        continue-on-error: true
        env:
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      - name: Package and Upload
        shell: bash
        run: |
          if [ -d build/windows/x64/Release ]; then
            cd build/windows/x64/Release
            7z a ../../../nex-windows.zip .
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nex-windows
          path: build/nex-windows.zip

  release:
    name: Create Release
    needs: [build-linux, build-android, build-ios, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts/ || echo "No artifacts"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}