name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libjpeg-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release 2>&1 | tee build.log
        continue-on-error: true
      - name: Package
        if: success()
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../nex-${{ github.ref_name }}-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-package
          path: build/nex-*.tar.gz

  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release 2>&1 | tee build.log
        continue-on-error: true
      - name: Package
        if: success()
        run: mv build/app/outputs/flutter-apk/app-release.apk build/nex-${{ github.ref_name }}-android.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-package
          path: build/nex-*.apk

  build-ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign 2>&1 | tee build.log
        continue-on-error: true
      - name: Package
        if: success()
        run: |
          cd build/ios/iphoneos
          zip -r ../../nex-${{ github.ref_name }}-ios.zip Runner.app
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-package
          path: build/nex-*.zip

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release 2>&1 | tee build.log
        continue-on-error: true
      - name: Package
        if: success()
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../nex-${{ github.ref_name }}-macos.zip *.app
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-package
          path: build/nex-*.zip

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build
        run: flutter build windows --release 2>&1 | tee build.log
        continue-on-error: true
        env:
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      - name: Package
        if: success()
        run: |
          cd build/windows/x64/Release
          7z a ../../../nex-${{ github.ref_name }}-windows.zip .
        shell: bash
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-package
          path: build/nex-*.zip

  release:
    name: Create Release
    needs: [build-linux, build-android, build-ios, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
