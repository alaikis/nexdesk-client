name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter config --enable-linux-desktop
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libjpeg-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release 2>&1
        continue-on-error: true
      - name: Package and Upload
        run: |
          echo "=== Checking build output ==="
          ls -la build/linux/x64/release/bundle/ 2>/dev/null || echo "Build output not found"
          if [ -d build/linux/x64/release/bundle ]; then
            cd build/linux/x64/release/bundle
            tar -czf ../../../nex-linux-x64.tar.gz .
            echo "=== Package created ==="
            ls -la ../../../nex-linux-x64.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-linux-x64
          path: build/nex-linux-x64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: flutter pub get
      - run: flutter build apk --release 2>&1
        continue-on-error: true
      - name: Package and Upload
        run: |
          echo "=== Checking build output ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Build output not found"
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-release.apk build/nex-android.apk
            echo "=== Package created ==="
            ls -la build/nex-android.apk
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-android
          path: build/nex-android.apk

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign 2>&1
        continue-on-error: true
      - name: Package and Upload
        run: |
          echo "=== Checking build output ==="
          ls -la build/ios/iphoneos/ 2>/dev/null || echo "Build output not found"
          if [ -d build/ios/iphoneos/Runner.app ]; then
            mkdir -p build/ios/ipa/Payload
            cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r ../../nex-ios.zip Payload
            echo "=== Package created ==="
            ls -la ../../nex-ios.zip
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-ios
          path: build/nex-ios.zip

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release 2>&1
        continue-on-error: true
      - name: Package and Upload
        run: |
          echo "=== Checking build output ==="
          ls -la build/macos/Build/Products/Release/ 2>/dev/null || echo "Build output not found"
          if ls build/macos/Build/Products/Release/*.app 1>/dev/null 2>&1; then
            cd build/macos/Build/Products/Release
            zip -r ../../../nex-macos.zip *.app
            echo "=== Package created ==="
            ls -la ../../../nex-macos.zip
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-macos
          path: build/nex-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release 2>&1
        continue-on-error: true
        env:
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      - name: Package and Upload
        shell: bash
        run: |
          echo "=== Checking build output ==="
          ls -la build/windows/x64/Release/ 2>/dev/null || echo "Build output not found"
          if [ -d build/windows/x64/Release ]; then
            cd build/windows/x64/Release
            7z a ../../../nex-windows.zip .
            echo "=== Package created ==="
            ls -la ../../../nex-windows.zip
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nex-windows
          path: build/nex-windows.zip

  release:
    name: Create Release
    needs: [build-linux, build-android, build-ios, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: |
          echo "=== After download ==="
          ls -la artifacts/ 2>/dev/null || echo "No artifacts dir"
          echo "=== Files ==="
          find artifacts/ -type f 2>/dev/null | head -20
          echo "=== File sizes ==="
          du -sh artifacts/* 2>/dev/null || echo "No files"
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/nex-linux-x64.tar.gz
            artifacts/nex-android.apk
            artifacts/nex-ios.zip
            artifacts/nex-macos.zip
            artifacts/nex-windows.zip
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show release info
        run: |
          echo "Release URL: ${{ steps.create_release.outputs.url }}"
          echo "Upload URL: ${{ steps.create_release.outputs.upload_url }}"
