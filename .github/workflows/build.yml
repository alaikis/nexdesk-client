name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22'
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libjpeg-dev libsecret-1-dev
      - run: flutter pub get
      - name: Download libwebrtc
        run: |
          mkdir -p linux/flutter/ephemeral/.plugin_symlinks/flutter_webrtc/third_party/downloads
          curl -L "https://github.com/webrtc-sdk/libwebrtc/releases/download/libwebrtc.m144.7559.09/libwebrtc-linux-x64-release.zip" -o linux/flutter/ephemeral/.plugin_symlinks/flutter_webrtc/third_party/downloads/libwebrtc-linux-x64-release.zip
          ls -lh linux/flutter/ephemeral/.plugin_symlinks/flutter_webrtc/third_party/downloads/
      - run: flutter build linux --release
      - name: Package Linux
        run: |
          ls -la build/linux/x64/release/bundle/
          tar -czf nex-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          ls -lh nex-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nex-linux-x64
          path: nex-linux-x64.tar.gz

  build-android:
    name: Build Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nex-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS
        run: |
          ls -la build/macos/Build/Products/Release/
          zip -r ../../../nex-macos.zip build/macos/Build/Products/Release/*.app
      - uses: actions/upload-artifact@v4
        with:
          name: nex-macos
          path: nex-macos.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
        env:
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      - name: Package Windows
        shell: bash
        run: |
          ls -la build/windows/x64/Release/
          7z a ../../../nex-windows.zip build/windows/x64/Release/.
      - uses: actions/upload-artifact@v4
        with:
          name: nex-windows
          path: nex-windows.zip

  release:
    name: Create Release
    needs: [build-linux, build-android, build-macos, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List downloaded files
        run: |
          echo "=== Release Assets ==="
          find release-assets/ -type f | while read f; do
            echo "  $f ($(stat -c%s "$f") bytes)"
          done
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
