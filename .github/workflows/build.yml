name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.24.0'
  APP_NAME: nex

jobs:
  # ============================================
  # Android Build
  # ============================================
  build-android:
    name: Android (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [apk, appbundle]
        include:
          - target: apk
            build_cmd: flutter build apk --release
            artifact_name: app-release.apk
            output_path: build/app/outputs/flutter-apk/
          - target: appbundle
            build_cmd: flutter build appbundle --release
            artifact_name: app-release.aab
            output_path: build/app/outputs/bundle/release/
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build ${{ matrix.target }}
        run: ${{ matrix.build_cmd }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.target }}
          path: ${{ matrix.output_path }}${{ matrix.artifact_name }}

  # ============================================
  # iOS Build
  # ============================================
  build-ios:
    name: iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Install CocoaPods
        run: cd ios && pod install && cd ..
      
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      
      - name: Create IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../ipa/ipa Payload
          rm -rf Payload
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/ipa

  # ============================================
  # macOS Build
  # ============================================
  build-macos:
    name: macOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: Enable desktop
        run: flutter config --enable-macos-desktop
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build macOS
        run: flutter build macos --release
      
      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "NEX Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 190 \
            "build/macos/NEX.dmg" \
            "build/macos/Build/Products/Release/NEX.app"
        continue-on-error: true
      
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/NEX.app
      
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/NEX.dmg
        if: success()

  # ============================================
  # Windows Build
  # ============================================
  build-windows:
    name: Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: Enable desktop
        run: flutter config --enable-windows-desktop
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Windows
        run: flutter build windows --release
      
      - name: Create MSIX
        run: |
          flutter pub add msix --dev
          flutter pub run msix:create
        continue-on-error: true
      
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: build/windows/runner/Release/*.msix
      
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/windows/runner/Release/

  # ============================================
  # Linux Build (Multi-Format)
  # ============================================
  build-linux:
    name: Linux (${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        format: [appimage, deb, rpm, snap, flatpak]
        include:
          - format: appimage
            build_cmd: github
          - format: deb
            build_cmd: github
          - format: rpm
            build_cmd: github
          - format: snap
            build_cmd: github
          - format: flatpak
            build_cmd: github
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: Enable desktop
        run: flutter config --enable-linux-desktop
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            libx11-dev \
            libxext-dev \
            libxtst-dev \
            libjpeg-dev \
            cmake \
            unzip
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Linux
        run: flutter build linux --release
      
      - name: Install linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy
      
      - name: Build ${{ matrix.format }}
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh ${{ matrix.format }}
        continue-on-error: true
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.format }}
          path: dist/linux/*

  # ============================================
  # Release Job (creates GitHub Release)
  # ============================================
  release:
    name: Create Release
    needs: [build-android, build-ios, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure
        run: ls -R artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
