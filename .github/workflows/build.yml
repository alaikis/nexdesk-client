name: CI/CD - Multi-Platform Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.9'
  APP_NAME: NEX

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    env:
      # 生产证书（可选）。未配置时自动回退到自签名证书。
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from VERSION
        shell: bash
        run: |
          set -e
          V=$(tr -d '[:space:]' < VERSION)
          test -n "$V" || { echo "VERSION file is empty"; exit 1; }
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=$V"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build windows --release
        env:
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

      - name: Stage Windows payload
        shell: bash
        run: |
          set -e
          SRC=build/windows/x64/runner/Release
          if [ ! -f "$SRC/nex.exe" ]; then
            echo "nex.exe not found under $SRC"
            find build/windows -maxdepth 5 -type d || true
            exit 1
          fi
          rm -rf installer/nex-windows
          mkdir -p installer/nex-windows
          cp -r "$SRC"/. installer/nex-windows/
          cp installer/setup/app_icon.ico installer/nex-windows/app_icon.ico
          ls -lh installer/nex-windows | head -20

      - name: Prepare signing material
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'nex-code-signing.pfx'

          if ($env:WINDOWS_CERT_PFX) {
            Write-Host 'Using production certificate from secrets.'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
            $password = $env:WINDOWS_CERT_PASSWORD
          } else {
            Write-Host 'WINDOWS_CERT_PFX not configured - generating a self-signed certificate.'
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject 'CN=NEX Code Signing (Self-Signed)' `
              -CertStoreLocation Cert:\CurrentUser\My `
              -KeyExportPolicy Exportable `
              -KeySpec Signature `
              -KeyUsage DigitalSignature `
              -HashAlgorithm SHA256 `
              -FriendlyName 'NEX Code Signing' `
              -NotAfter (Get-Date).AddYears(3)
            $chars = 48..57 + 65..90 + 97..122
            $password = -join ($chars | Get-Random -Count 32 | ForEach-Object { [char]$_ })
            $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $secure | Out-Null
            Write-Host "Self-signed certificate thumbprint: $($cert.Thumbprint)"
          }

          "PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PFX_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign application binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }

          $targets = @(Get-ChildItem -Path installer/nex-windows -Filter *.exe -Recurse)
          if ($targets.Count -eq 0) { throw 'no exe found to sign' }

          foreach ($t in $targets) {
            Write-Host "Signing $($t.FullName)"
            & $signtool.FullName sign /fd SHA256 /f $env:PFX_PATH /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($t.FullName)" }

            # 自签名证书不受信任，Get-AuthenticodeSignature 会返回 UnknownError，
            # 因此这里只断言“确实带上了签名者证书”，不用 /pa 策略校验。
            $sig = Get-AuthenticodeSignature $t.FullName
            if ($null -eq $sig.SignerCertificate) { throw "no signature on $($t.FullName): $($sig.Status)" }
            Write-Host "Signed $($t.Name) | status=$($sig.Status) | subject=$($sig.SignerCertificate.Subject)"
          }

      - name: Build installer (NSIS)
        shell: bash
        run: |
          set -e
          command -v makensis >/dev/null 2>&1 || choco install nsis -y --no-progress
          cd installer
          # 单一版本来源：clients/VERSION
          sed -i "s/^!define APP_VERSION .*/!define APP_VERSION \"${APP_VERSION}\"/" nex.nsi
          makensis nex.nsi
          cp NEX-Setup-*.exe ../
          cd ..
          ls -lh NEX-Setup-*.exe

      - name: Sign installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }

          $installer = Get-ChildItem -Path . -Filter 'NEX-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'installer not found' }
          & $signtool.FullName sign /fd SHA256 /f $env:PFX_PATH /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed for the installer' }

          $sig = Get-AuthenticodeSignature $installer.FullName
          if ($null -eq $sig.SignerCertificate) { throw "installer is not signed: $($sig.Status)" }
          Write-Host "Signed $($installer.Name) | status=$($sig.Status) | subject=$($sig.SignerCertificate.Subject)"

      - name: Package portable ZIP
        shell: bash
        run: |
          set -e
          OUT="NEX-v${APP_VERSION}-windows-portable.zip"
          rm -f "$OUT"
          ( cd installer/nex-windows && 7z a "../../${OUT}" . >/dev/null )
          ls -lh "$OUT"

      - name: Compute checksums
        shell: bash
        run: |
          set -e
          sha256sum NEX-Setup-*.exe > "NEX-v${APP_VERSION}-windows-installer.exe.sha256"
          sha256sum NEX-v${APP_VERSION}-windows-portable.zip > "NEX-v${APP_VERSION}-windows-portable.zip.sha256"
          cat *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            NEX-Setup-*.exe
            NEX-v${{ env.APP_VERSION }}-windows-portable.zip
            *.sha256

  build-macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS
        shell: bash
        run: |
          set -e
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          test -n "$APP" || { echo "no .app bundle found"; exit 1; }
          V=$(tr -d '[:space:]' < VERSION)
          zip -qr "NEX-v${V}-macos.zip" "$APP"
          ls -lh NEX-v*.zip
          sha256sum NEX-v${V}-macos.zip > "NEX-v${V}-macos.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            NEX-v*-macos.zip
            NEX-v*-macos.zip.sha256

  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libjpeg-dev libsecret-1-dev liblzma-dev libfuse2
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux TAR
        shell: bash
        run: |
          set -e
          V=$(tr -d '[:space:]' < VERSION)
          tar -czf "NEX-v${V}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
          sha256sum "NEX-v${V}-linux-x64.tar.gz" > "NEX-v${V}-linux-x64.tar.gz.sha256"
          ls -lh NEX-v*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            NEX-v*-linux-x64.tar.gz
            NEX-v*-linux-x64.tar.gz.sha256

  build-android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Compute checksums
        shell: bash
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-release.apk .
          sha256sum app-release.apk > app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            app-release.apk
            app-release.apk.sha256

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux, build-android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: find release-assets -type f | sort
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## NEX ${{ steps.ver.outputs.version }}

            ### Downloads
            - **Windows**: `NEX-Setup-${{ steps.ver.outputs.version }}.exe` (installer) + `NEX-v${{ steps.ver.outputs.version }}-windows-portable.zip` (portable)
            - **macOS**: `NEX-v${{ steps.ver.outputs.version }}-macos.zip`
            - **Linux**: `NEX-v${{ steps.ver.outputs.version }}-linux-x64.tar.gz`
            - **Android**: `app-release.apk`

            ### Windows 代码签名
            未配置 `WINDOWS_CERT_PFX` secret 时使用**自签名证书**。自签名证书不在受信任根列表中，
            Windows SmartScreen 仍会提示"未知发布者"。企业内可通过组策略分发该证书以消除提示；
            正式对外分发请改用 Azure Trusted Signing 或 OV/EV 证书（配置 `WINDOWS_CERT_PFX` 即自动切换）。

            ### Installation
            - **Windows**: Run the `.exe` installer and follow the wizard.
            - **macOS**: Unzip and drag `NEX.app` to `/Applications`.
            - **Linux**: Extract the tarball.
            - **Android**: Install the APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}