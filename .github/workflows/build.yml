name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libjpeg-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
        continue-on-error: true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nex-linux-amd64-ubuntu2204
          path: build/linux/x64/release/bundle/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
        continue-on-error: true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nex-android-arm64-api34
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
        continue-on-error: true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nex-ios-arm64-ios17
          path: build/ios/iphoneos/Runner.app

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
        continue-on-error: true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nex-macos-universal-ventura
          path: build/macos/Build/Products/Release/*.app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
        continue-on-error: true
        env:
          CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nex-windows-x64-win11
          path: build/windows/runner/Release/

  release:
    name: Create Release
    needs: [build-linux, build-android, build-ios, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          find artifacts/ -type f 2>/dev/null | while read f; do
            echo "  $f ($(stat -c%s "$f") bytes)"
          done
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Creating release ==="
          gh release create "${{ github.ref_name }}" \
            --title "NEX ${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            --prerelease 2>&1 || echo "CREATE_FAILED"
          
          echo "=== Uploading files ==="
          for f in artifacts/*; do
            if [ -f "$f" ]; then
              echo "Uploading $(basename $f)..."
              gh release upload "${{ github.ref_name }}" "$f" --clobber 2>&1 || echo "UPLOAD_FAILED: $f"
            fi
          done
          
          echo "=== Release info ==="
          gh release view "${{ github.ref_name }}" 2>&1 || echo "VIEW_FAILED"