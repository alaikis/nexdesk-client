name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # ============================================
  # Nightly Build All Platforms
  # ============================================
  build-all:
    name: Nightly (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            target: apk
            build_cmd: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - platform: ios
            os: macos-latest
            target: ios
            build_cmd: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app
          - platform: macos
            os: macos-latest
            target: macos
            build_cmd: flutter build macos --release
            artifact: build/macos/Build/Products/Release/NEX.app
          - platform: windows
            os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            artifact: build/windows/runner/Release/flutter_app.exe
          - platform: linux
            os: ubuntu-latest
            target: linux
            build_cmd: flutter build linux --release
            artifact: build/linux/x64/release/bundle/flutter_app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: Enable desktop
        run: |
          flutter config --enable-macos-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-linux-desktop
        continue-on-error: true
      
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxext-dev libxtst-dev libjpeg-dev
      
      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.build_cmd }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          retention-days: 7
